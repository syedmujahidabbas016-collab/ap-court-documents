```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - AP Court Documents</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        .profile-page {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .profile-card {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #1e3a8a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 38px;
        }

        .profile-header h1 {
            margin: 0;
        }

        .profile-header .email {
            margin-top: 8px;
            color: #666;
        }

        .profile-info {
            display: grid;
            gap: 18px;
        }

        .profile-field {
            padding: 15px;
            background: #f5f6f8;
            border-radius: 8px;
        }

        .profile-field strong {
            display: block;
            margin-bottom: 5px;
        }

        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-profile-action {
            border: none;
            padding: 12px 18px;
            border-radius: 7px;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        .btn-edit {
            background: #2563eb;
        }

        .btn-change-password {
            background: #16a34a;
        }

        .btn-delete {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <div class="profile-page">

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-icon">
                    <i class="fas fa-user"></i>
                </div>

                <h1>My Profile</h1>

                <p class="email">Loading...</p>

            </div>


            <div class="profile-info">

                <div class="profile-field">
                    <strong>First Name</strong>
                    <span class="value" id="profileFirstName">
                        Loading...
                    </span>
                </div>

                <div class="profile-field">
                    <strong>Last Name</strong>
                    <span class="value" id="profileLastName">
                        Loading...
                    </span>
                </div>

                <div class="profile-field">
                    <strong>Email</strong>
                    <span class="value" id="profileEmail">
                        Loading...
                    </span>
                </div>

                <div class="profile-field">
                    <strong>Phone</strong>
                    <span class="value" id="profilePhone">
                        Loading...
                    </span>
                </div>

                <div class="profile-field">
                    <strong>Role</strong>
                    <span class="value" id="profileRole">
                        User
                    </span>
                </div>

            </div>


            <div class="profile-actions">

                <button
                    type="button"
                    class="btn-profile-action btn-edit"
                    onclick="editProfile()">

                    <i class="fas fa-edit"></i>
                    Edit Profile

                </button>


                <button
                    type="button"
                    class="btn-profile-action btn-change-password"
                    onclick="changePassword()">

                    <i class="fas fa-key"></i>
                    Change Password

                </button>


                <button
                    type="button"
                    class="btn-profile-action btn-delete"
                    onclick="deleteAccount()">

                    <i class="fas fa-trash"></i>
                    Delete Account

                </button>

            </div>

        </div>

    </div>


    <!-- Main JavaScript -->

    <script src="js/main.js"></script>

    <!-- Profile JavaScript -->

    <script src="js/profile.js"></script>


</body>

</html>
```
