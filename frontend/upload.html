<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Document - AP Court Documents</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .upload-container {
            max-width: 900px;
            margin: 100px auto 40px;
            padding: 0 20px;
        }
        
        .upload-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .upload-box h1 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        
        .upload-box .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        
        .form-group label .required {
            color: #dc3545;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #4a6cf7;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .file-drop-zone {
            border: 3px dashed #d0d5dd;
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fc;
        }
        
        .file-drop-zone:hover {
            border-color: #4a6cf7;
            background: #f0f3ff;
        }
        
        .file-drop-zone.dragover {
            border-color: #4a6cf7;
            background: #e8edff;
        }
        
        .file-drop-zone i {
            font-size: 48px;
            color: #4a6cf7;
            margin-bottom: 15px;
        }
        
        .file-drop-zone h3 {
            font-size: 20px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        
        .file-drop-zone p {
            color: #666;
        }
        
        .file-drop-zone .file-types {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }
        
        #fileInfo {
            margin-top: 15px;
            padding: 15px;
            background: #f0f7ff;
            border-radius: 8px;
            display: none;
        }
        
        #fileInfo .file-name {
            font-weight: 600;
            color: #1a1a2e;
        }
        
        #fileInfo .file-size {
            color: #666;
            margin-left: 10px;
        }
        
        .btn-upload {
            width: 100%;
            padding: 14px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-upload:hover {
            background: #3a56d4;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 108, 247, 0.3);
        }
        
        .btn-upload:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .upload-progress {
            display: none;
            margin-top: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar .progress {
            height: 100%;
            background: #4a6cf7;
            border-radius: 4px;
            transition: width 0.3s;
            width: 0%;
        }
        
        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge.judgment { background: #e8f0fe; color: #1a73e8; }
        .badge.order { background: #fff3e0; color: #e67e22; }
        .badge.petition { background: #f3e8ff; color: #8e44ad; }
        .badge.affidavit { background: #e8f8f5; color: #16a085; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="mainNav">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="assets/images/logo.png" alt="AP Court Logo" class="logo-img">
                <span class="logo-text">AP Court Docs</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="search.html" class="nav-link">Search</a></li>
                <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li class="nav-item" id="authLinks">
                    <a href="login.html" class="nav-link btn-login">Login</a>
                    <a href="register.html" class="nav-link btn-register">Register</a>
                </li>
                <li class="nav-item" id="userLinks" style="display: none;">
                    <a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Profile</a>
                    <a href="#" class="nav-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="upload-container">
        <div class="upload-box">
            <h1><i class="fas fa-upload"></i> Upload Document</h1>
            <p class="subtitle">Upload court documents to the repository</p>

            <form id="uploadForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Document Title <span class="required">*</span></label>
                        <input type="text" class="form-control" id="docTitle" placeholder="Enter document title" required>
                    </div>
                    <div class="form-group">
                        <label>Case Number <span class="required">*</span></label>
                        <input type="text" class="form-control" id="caseNumber" placeholder="e.g., AP2024-001" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Document Type <span class="required">*</span></label>
                        <select class="form-control" id="docType" required>
                            <option value="">Select type</option>
                            <option value="judgment">Judgment</option>
                            <option value="order">Order</option>
                            <option value="petition">Petition</option>
                            <option value="affidavit">Affidavit</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Court <span class="required">*</span></label>
                        <select class="form-control" id="court" required>
                            <option value="">Select court</option>
                            <option value="supreme">Supreme Court</option>
                            <option value="high">High Court</option>
                            <option value="district">District Court</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Judge Name</label>
                        <input type="text" class="form-control" id="judge" placeholder="Enter judge name">
                    </div>
                    <div class="form-group">
                        <label>Date <span class="required">*</span></label>
                        <input type="date" class="form-control" id="docDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea class="form-control" id="description" rows="3" placeholder="Brief description of the document"></textarea>
                </div>

                <div class="form-group">
                    <label>Upload File <span class="required">*</span></label>
                    <div class="file-drop-zone" id="dropZone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <h3>Drag and drop your file here</h3>
                        <p>or click to browse</p>
                        <div class="file-types">Supported formats: PDF, DOCX, JPEG, PNG (Max 10MB)</div>
                    </div>
                    <input type="file" id="fileInput" style="display: none;" accept=".pdf,.docx,.jpg,.jpeg,.png">
                    <div id="fileInfo">
                        <i class="fas fa-file-alt"></i>
                        <span class="file-name" id="fileName">document.pdf</span>
                        <span class="file-size" id="fileSize">(2.5 MB)</span>
                    </div>
                </div>

                <div class="upload-progress" id="uploadProgress">
                    <div class="progress-bar">
                        <div class="progress" id="progressBar"></div>
                    </div>
                    <div class="progress-text" id="progressText">Uploading...</div>
                </div>

                <button type="submit" class="btn-upload" id="uploadBtn">
                    <i class="fas fa-upload"></i> Upload Document
                </button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
