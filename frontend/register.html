<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AP Court Documents</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="login-container">

    <div class="login-box register-box">

        <div class="login-header">

            <img src="assets/images/logo.png"
                 alt="Logo"
                 class="login-logo">

            <h2>Create Account</h2>

            <p>Register to access court documents</p>

        </div>


        <form id="registerForm" class="login-form">

            <div class="form-row">

                <div class="form-group half">

                    <label for="firstName">
                        First Name
                    </label>

                    <div class="input-group">

                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First name"
                            required>

                    </div>

                </div>


                <div class="form-group half">

                    <label for="lastName">
                        Last Name
                    </label>

                    <div class="input-group">

                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last name"
                            required>

                    </div>

                </div>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-group">

                    <i class="fas fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <div class="input-group">

                    <i class="fas fa-phone"></i>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number">

                </div>

            </div>


            <div class="form-group">

                <label for="role">
                    User Role
                </label>

                <div class="input-group">

                    <i class="fas fa-user-tag"></i>

                    <select id="role" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="advocate">
                            Advocate
                        </option>

                        <option value="judge">
                            Judge
                        </option>

                        <option value="court_staff">
                            Court Staff
                        </option>

                        <option value="public">
                            Public
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-group">

                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required>

                    <i
                        class="fas fa-eye toggle-password"
                        onclick="togglePassword()">
                    </i>

                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-group">

                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required>

                </div>

            </div>


            <div class="form-options">

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required>

                    I agree to the

                    <a href="#">
                        Terms of Service
                    </a>

                    and

                    <a href="#">
                        Privacy Policy
                    </a>

                </label>

            </div>


            <button
                type="submit"
                class="btn-login-submit">

                <i class="fas fa-user-plus"></i>

                Register

            </button>


            <div class="login-footer">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Sign in here
                    </a>

                </p>

            </div>

        </form>


        <div
            id="registerError"
            class="error-message"
            style="display:none;">

            <i class="fas fa-exclamation-circle"></i>

            <span id="errorText">
                Registration failed
            </span>

        </div>

    </div>

</div>


<!-- IMPORTANT: main.js FIRST, auth.js SECOND -->

<script src="js/main.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
